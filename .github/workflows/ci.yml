name: Garden Guerilla CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend – Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        run: mvn -B verify --no-transfer-progress
        working-directory: backend

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend-build:
    name: Frontend – Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker – Build Images
    runs-on: ubuntu-latest
    needs: [ backend-build-test, frontend-build ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (for backend JAR)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package backend JAR
        run: mvn -B package -DskipTests --no-transfer-progress
        working-directory: backend

      - name: Build backend Docker image
        run: docker build -t garden-guerilla-backend:ci .
        working-directory: backend

      - name: Build frontend Docker image
        run: docker build -t garden-guerilla-frontend:ci .
        working-directory: frontend
